{%load static%}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f3f3;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;
}


/* =========================
   LOGIN CARD - DESKTOP
========================= */

.login-card {
    width: 480px;
    min-height: 680px;

    background: #ffffff;

    border: 1px solid #d8d8d8;
    border-radius: 10px;

    position: relative;
    overflow: hidden;
}


/* =========================
   BLUE TOP SHAPE
========================= */

.top-shape {
    position: absolute;

    width: 220px;
    height: 220px;

    right: -105px;
    top: -105px;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #087df5,
        #7665e8
    );

    box-shadow:
        0 7px 0 rgba(130, 150, 255, 0.35);
}


/* =========================
   CONTENT
========================= */

.login-content {
    padding: 50px 42px 30px;

    position: relative;
    z-index: 2;
}


/* Small heading */

.subtitle {
    font-size: 16px;
    color: #777777;

    margin-bottom: 6px;
}


/* Main heading */

h1 {
    font-size: 34px;

    color: #171717;

    font-weight: 700;

    margin-bottom: 50px;
}


/* =========================
   INPUT BOX
========================= */

.input-box {
    position: relative;

    margin-bottom: 22px;
}


.input-box label {
    position: absolute;

    left: 16px;
    top: -9px;

    background: #ffffff;

    padding: 0 5px;

    color: #777777;

    font-size: 14px;

    z-index: 2;
}


.input-box input {
    width: 100%;
    height: 58px;

    border: 2px solid #e0e0e0;

    border-radius: 9px;

    padding: 0 18px;

    font-size: 15px;

    color: #333333;

    outline: none;
}


.input-box input::placeholder {
    color: #333333;
}


.input-box input:focus {
    border-color: #087df5;
}


/* Password eye */

.eye {
    position: absolute;

    right: 18px;
    top: 50%;

    transform: translateY(-50%);

    color: #888888;

    font-size: 17px;
}


/* =========================
   OPTIONS
========================= */

.options {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 5px;

    margin-bottom: 35px;
}


.remember {
    display: flex;

    align-items: center;

    gap: 7px;

    color: #444444;

    font-size: 14px;
}


.remember input {
    width: 17px;
    height: 17px;
}


.options a {
    color: #2684b5;

    font-size: 14px;

    text-decoration: underline;
}


/* =========================
   SIGN IN BUTTON
========================= */

.signin-btn {
    width: 100%;
    height: 58px;

    border: none;

    border-radius: 8px;

    background: #087df5;

    color: white;

    font-size: 18px;

    font-weight: 600;

    cursor: pointer;
}


.signin-btn:hover {
    background: #0671df;
}

/* images */
.google, .facebook, .apple{
    width:40px;
    height: 40px;
}
/* =========================
   DIVIDER
========================= */

.divider {
    display: flex;

    align-items: center;

    gap: 12px;

    margin: 27px 0;
}


.divider span {
    height: 2px;

    background: #eeeeee;

    flex: 1;
}


.divider p {
    color: #777777;

    font-size: 15px;
}


/* =========================
   SOCIAL BUTTONS
========================= */

.social-buttons {
    display: flex;

    gap: 15px;
}


.social-btn {
    flex: 1;

    height: 55px;

    background: white;

    border: 2px solid #eeeeee;

    border-radius: 8px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 27px;
}


.social-btn:hover {
    background: #fafafa;
}



/* =========================
   SIGN UP
========================= */

.signup {
    text-align: center;

    margin-top: 24px;

    color: #333333;

    font-size: 15px;
}


.signup a {
    color: #2684b5;

    text-decoration: underline;
}


/* =========================
   MOBILE RESPONSIVE
   DON'T CHANGE
========================= */

@media (max-width: 650px) {

    body {
        padding: 15px;
    }

    .login-card {
        width: 100%;
        min-height: auto;
    }

    .login-content {
        padding: 55px 25px 35px;
    }

    h1 {
        font-size: 32px;

        margin-bottom: 55px;
    }

    .subtitle {
        font-size: 16px;
    }

    .options {
        margin-bottom: 35px;
    }

    .social-buttons {
        gap: 12px;
    }
}


@media (max-width: 400px) {

    .login-content {
        padding: 50px 18px 30px;
    }

    h1 {
        font-size: 29px;
    }

    .options {
        flex-direction: column;

        align-items: flex-start;

        gap: 15px;
    }
}

</style>
</head>

<body>

    <div class="login-card">

        <!-- Blue curved shape -->
        <div class="top-shape"></div>

        <div class="login-content">

            <p class="subtitle">
                Please enter your details
            </p>

            <h1>Welcome Back</h1>

           <!-- Login Form -->
<form action="{%url 'login' %}" method="POST">

    {% csrf_token %}

    <!-- username-->
    <div class="input-box">
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your Username"
            required
        >
    </div>

    <!-- Password -->
    <div class="input-box">
        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

      
    </div>

    <!-- Options -->
    <div class="options">

        <label class="remember">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
        </label>

        <a href="#">
            Forgot password?
        </a>

    </div>

    <button type="submit" class="signin-btn">
        Login
    </button>

</form>


<!-- OR -->
<div class="divider">
    <span></span>
    <p>Or</p>
    <span></span>
</div>


<!-- Social Buttons -->
<div class="social-buttons">

    <button class="social-btn" type="button">
        <img src="{% static 'images/google.svg' %}" class="google" alt="Google">
    </button>

    <button class="social-btn" type="button">
        <img src="{% static 'images/facebook.svg' %}" class="facebook" alt="Facebook">
    </button>

    <button class="social-btn" type="button">
        <img src="{% static 'images/apple.svg' %}" class="apple" alt="Apple">
    </button>

</div>


            <!-- Signup -->
            <p class="signup">
                Don't have an account?
                <a href="{%url 'register' %}">
                    Sign up
                </a>
            </p>

        </div>

    </div>

</body>
</html>

{%extends 'base.html'%} 
 
{%block content%}

<style>

/* =========================
   ALL CATEGORIES PAGE
========================= */

.category-page {
    padding: 10px 0 40px;
}

/* Right Content */
.category-page .col-md-9 {
    padding-left: 18px;
    padding-right: 18px;
}

/* Heading */
.category-page h3 {
    margin: 0 0 18px 0;
    color: #172033;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.35;
}

/* Add New Button */
.category-page .btn-dark {
    background: #087df5 !important;
    border: 1px solid #087df5 !important;
    border-radius: 8px;
    padding: 9px 17px;
    color: #ffffff !important;
    font-size: 14px;
    font-weight: 600;
    box-shadow: none;
    transition: all 0.2s ease;
}

.category-page .btn-dark:hover {
    background: #066bd2 !important;
    border-color: #066bd2 !important;
    transform: translateY(-1px);
}

/* Table */
.category-page .table {
    width: 100%;
    margin-top: 12px;
    margin-bottom: 0;
    background: #ffffff;
    border: 1px solid #e7edf5;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(23, 32, 51, 0.05);
}

/* Table Header */
.category-page .table thead th {
    padding: 15px 16px;
    background: #f8fbff;
    border-bottom: 1px solid #e7edf5;
    color: #172033;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
}

/* Table Body */
.category-page .table tbody td {
    padding: 15px 16px;
    border-top: 1px solid #edf1f6;
    color: #59677a;
    font-size: 14px;
    vertical-align: middle;
}

/* Row Hover */
.category-page .table-hover tbody tr {
    transition: background 0.2s ease;
}

.category-page .table-hover tbody tr:hover {
    background: #f8fbff;
}

/* Category Name */
.category-page .table tbody td:nth-child(2) {
    color: #172033;
    font-weight: 600;
}

/* Action Icons */
.category-page .table td:last-child {
    white-space: nowrap;
}

.category-page .table td:last-child a {
    text-decoration: none;
    display: inline-block;
    margin-right: 8px;
}

.category-page .table td:last-child .fa {
    font-size: 15px;
    transition: all 0.2s ease;
}

.category-page .table td:last-child .fa-edit:hover {
    color: #087df5 !important;
    transform: scale(1.1);
}

.category-page .table td:last-child .fa-trash:hover {
    color: #c82333 !important;
    transform: scale(1.1);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 767px) {

    .category-page {
        padding: 5px 0 30px;
    }

    .category-page .col-md-9 {
        padding-left: 0;
        padding-right: 0;
        margin-top: 20px;
    }

    .category-page h3 {
        font-size: 21px;
        margin-bottom: 15px;
    }

    .category-page .btn-dark {
        padding: 8px 13px;
        font-size: 13px;
    }

    /* Allow table to scroll horizontally */
    .category-page .table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
        border-radius: 10px;
    }

    .category-page .table thead th {
        padding: 13px 14px;
        font-size: 12px;
    }

    .category-page .table tbody td {
        padding: 13px 14px;
        font-size: 13px;
    }

}


/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 400px) {

    .category-page h3 {
        font-size: 19px;
    }

    .category-page .btn-dark {
        padding: 7px 11px;
        font-size: 12px;
    }

    .category-page .table thead th {
        padding: 12px;
    }

    .category-page .table tbody td {
        padding: 12px;
    }

}

</style>


<div class="category-page">

 <div class="row"> 
 
<!-- load the side bar here  --> 
  {%include 'dashboard/sidebar.html' %} 
 
<!-- right side  --> 
 <div class="col-md-9"> 
 
  <h3>All Categories</h3> 
 
  <a href="{%url 'add_category'%}" class="btn btn-dark text-light float-right mb-2">
      Add New
  </a> 
 
<table class="table table-hover"> 
 
 <thead> 
    <tr> 
      <th>No</th> 
      <th>Category Name</th> 
      <th>Created At</th> 
      <th>Updated At</th> 
      <th>Action</th> 
    </tr> 
  </thead> 
 
  <tbody> 
 
    {%for cat in categories%} 
 
    <tr> 
      <td>{{forloop.counter}}</td> 
      <td>{{cat}}</td> 
      <td>{{cat.created_at}}</td> 
      <td>{{cat.updated_at}}</td> 
 
      <td> 
        <a href="{%url 'edit_category' cat.id %}">
            <i class="fa fa-edit text-success"></i>
        </a>&nbsp; 
 
        <a href="{%url 'delete_category' cat.id%}">
            <i class="fa fa-trash text-danger"></i>
        </a>
      </td> 
 
    </tr> 
 
   {%endfor%} 
 
  </tbody> 
 
</table> 
 
 </div> 
</div>

</div>

{%endblock%}
